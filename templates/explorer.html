{% extends "base.html" %}

{% block title %}Smart Query — Analytics &amp; Explorer{% endblock %}

{% block extra_head %}
    <style>
        body { height: 100vh; overflow: hidden; }
    </style>
{% endblock %}

{% block orbs %}{% endblock %}

{% block nav_explorer %}active{% endblock %}

{% block content %}
    <main class="app-iframe-container">
        <iframe
            src="{{ streamlit_url }}/?embed=true&amp;sso_token={{ streamlit_sso_token | urlencode }}"
            class="app-iframe"
            title="Analytics &amp; Explorer"
            allow="clipboard-read; clipboard-write"
        ></iframe>
    </main>
{% endblock %}

{% block footer %}{% endblock %}
