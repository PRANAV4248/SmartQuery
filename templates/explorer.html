{% extends "base.html" %}

{% block title %}Smart Query — Analytics &amp; Explorer{% endblock %}

{% block extra_head %}
<style>
    html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
    }

    /* The Streamlit app should sit directly beneath the SmartQuery navbar. */
    .app-iframe-container {
        position: fixed !important;
        top: 60px !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100vw !important;
        height: calc(100vh - 60px) !important;

        margin: 0 !important;
        padding: 0 !important;

        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: #0f1115 !important;

        overflow: hidden !important;
    }

    .app-iframe {
        display: block !important;
        position: absolute !important;
        inset: 0 !important;

        width: 100% !important;
        height: 100% !important;

        margin: 0 !important;
        padding: 0 !important;

        border: 0 !important;
        outline: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: #0f1115 !important;
    }
</style>
{% endblock %}

{% block orbs %}{% endblock %}

{% block nav_explorer %}active{% endblock %}

{% block content %}
    <main class="app-iframe-container">
        <iframe
            src="{{ streamlit_url.rstrip('/') }}/?embed=true&amp;sso_token={{ streamlit_sso_token | urlencode }}"
            class="app-iframe"
            title="Analytics &amp; Explorer"
            allow="clipboard-read; clipboard-write"
        ></iframe>
    </main>
{% endblock %}

{% block footer %}{% endblock %}
